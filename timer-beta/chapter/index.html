<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/assets/graphics/favicon.svg">
    <title>Dead End - Chapitre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-wc@0.9.28/dist/dotlottie-wc.js"></script>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            /* Stops accidental double-tap-to-zoom on quick successive taps; pinch-zoom
               still works. */
            touch-action: manipulation;
        }

        [hidden] {
            display: none !important;
        }

        body {
            background-color: #000000;
            /* Deliberately taller than the viewport: iOS Safari renders content behind an
               expanded toolbar/tab-strip when the page exactly fits (or is shorter than) its
               chrome-collapsed viewport, since it then treats the page as non-scrollable. The
               extra height guarantees real scroll room so Safari always positions content
               below its chrome instead. */
            min-height: calc(100vh + 150px);
            min-height: calc(100dvh + 150px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .frame {
            width: min(95vw, 1100px);
            min-height: calc(100vh - 40px);
            background-color: #000000;
            border: 8.5px solid #FFCC00;
            display: flex;
        }

        .sidebar {
            flex: 0 0 clamp(180px, 26%, 260px);
            border-right: 8.5px solid #FFCC00;
            display: flex;
            flex-direction: column;
        }

        .chapter-banner {
            background-color: #FFCC00;
            color: #000000;
            padding: 12px;
            overflow: hidden;
        }

        .chapter-banner-text {
            display: inline-block;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 2rem;
            letter-spacing: -0.03em;
            line-height: 1;
            white-space: nowrap;
        }

        .sidebar-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 3vw, 20px);
            padding: clamp(16px, 3vw, 24px);
            text-align: center;
        }

        .dice-of-fortune dotlottie-wc {
            /* Fixed px, not vw-based: on rotation the vw value changes, and the lottie
               player's internal canvas doesn't reliably resync during iOS Safari's async
               rotation resize, leaving a stale canvas stretched into the new box. */
            width: 100px;
            height: 100px;
            display: block;
            cursor: pointer;
        }

        .sidebar-help-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: clamp(12px, 3vw, 12px);
        }

        .sidebar-tabs {
            display: flex;
            gap: clamp(3px, 0.8vw, 6px);
        }

        .sidebar-tab {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1.9 / 1;
            background-color: #000000;
            border: 2px solid #FFCC00;
            border-bottom: none;
            cursor: pointer;
        }

        .sidebar-tab.active {
            background-color: #FFCC00;
            border-color: #FFCC00;
        }

        .sidebar-tab-icon {
            width: clamp(24px, 6vw, 32px);
            height: clamp(24px, 6vw, 32px);
            display: block;
        }

        .sidebar-tab-panel {
            flex: 1;
            background-color: #FFCC00;
            padding: clamp(12px, 2.5vw, 12px);
            overflow-y: auto;
        }

        .sidebar-help-list {
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.5vw, 12px);
        }

        .sidebar-tab-item {
            background-color: transparent;
            color: #000000;
            border: 2px solid #000000;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(0.85rem, 2vw, 1.05rem);
            padding: clamp(6px, 1vw, 12px);
            cursor: pointer;
            letter-spacing: -0.03em;
        }

        .sidebar-tab-item:hover {
            background-color: #000000;
            color: #FFCC00;
        }

        .dice-instructions {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1.3rem;
            color: #FFFFFF;
            line-height: 1.4;
            letter-spacing: -0.03em;
        }

        .timer-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #timerView {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .timer-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(16px, 4vw, 48px) clamp(12px, 2vw, 24px);
        }

        .timer-display {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(3rem, 13vw, 10rem);
            color: #FFCC00;
            line-height: 1;
            white-space: nowrap;
            letter-spacing: -0.05em;
        }

        .timer-display span {
            display: inline-block;
            width: 2ch;
            text-align: center;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 clamp(12px, 2vw, 24px) clamp(12px, 2vw, 16px);
            gap: clamp(8px, 1.5vw, 16px);
        }

        .controls-left {
            display: flex;
            gap: clamp(8px, 1.5vw, 16px);
        }

        button {
            background-color: #000000;
            color: #FFFFFF;
            border: 3px solid #FFFFFF;
            border-radius: 0;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1.3rem;
            padding: clamp(7px, 1.2vw, 13px) clamp(12px, 2vw, 28px);
            cursor: pointer;
            letter-spacing: -0.03em;
        }

        button:disabled {
            color: #B0B0B0;
            border-color: #B0B0B0;
            cursor: default;
        }

        .end-chapter-row {
            padding: 0 clamp(12px, 2vw, 24px) clamp(14px, 2.5vw, 24px);
        }

        .end-chapter-btn {
            width: 100%;
        }

        .item-detail-actions {
            display: flex;
            gap: clamp(8px, 1.5vw, 16px);
        }

        .item-detail-use-btn {
            flex: 1;
        }

        .item-detail-close-btn {
            flex: 0 0 auto;
        }

        .item-detail-close-btn.full-width {
            flex: 1;
        }

        .dice-result-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(14px, 2.5vw, 24px) clamp(12px, 2vw, 24px);
        }

        .dice-result-content {
            display: flex;
            flex-direction: column;
            gap: clamp(0.8rem, 4vw, 3rem);
        }

        .dice-result-heading {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(3rem, 3vw, 4.5rem);
            color: #FFCC00;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .dice-result-list {
            list-style: none;
            margin-top: 0;
        }

        .dice-result-list li {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(1.6rem, 3.6vw, 2.3rem);
            color: #FFFFFF;
            letter-spacing: -0.03em;
            line-height: 1.15;
        }

        .sort-description {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(1.6rem, 3.6vw, 2.3rem);
            color: #FFFFFF;
            letter-spacing: -0.03em;
            line-height: 1.15;
        }

        .item-detail-heading-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: clamp(8px, 1.5vw, 16px);
        }

        .item-detail-badge {
            flex: 0 0 auto;
            background-color: #FFCC00;
            color: #000000;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            line-height: 1;
            font-size: clamp(1.9rem, 3vw, 3.35rem);
            padding: 0.3em 0.5em;
        }

        .item-detail-description {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 0.65vw, 14px);
        }

        .item-detail-description-primary {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(1.9rem, 4vw, 3.35rem);
            color: #FFFFFF;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .item-detail-description-secondary {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(1.25rem, 2.75vw, 2.2rem);
            color: #FFFFFF;
            letter-spacing: -0.03em;
            line-height: 1.15;
        }

        .portrait-overlay {
            display: none;
        }

        @media (orientation: portrait) {
            .frame {
                display: none;
            }
            .portrait-overlay {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100vw;
                height: 100vh;
                font-family: 'Oswald', sans-serif;
                font-weight: 700;
                font-size: clamp(1.5rem, 8vw, 3rem);
                text-transform: uppercase;
                color: #FFFFFF;
            }
        }
    </style>
</head>
<body>
    <div class="portrait-overlay">Tournez votre écran</div>
    <div class="frame">
        <div class="sidebar">
            <div class="chapter-banner"><span class="chapter-banner-text">Chapitre #1</span></div>
            <div id="sidebarDiceView" class="sidebar-body">
                <div class="dice-of-fortune">
                    <dotlottie-wc id="diceAnim"></dotlottie-wc>
                </div>
                <div id="diceInstructions" class="dice-instructions">Lancer les dés de la fortune pour commencer.</div>
            </div>
            <div id="sidebarHelpView" class="sidebar-help-view" hidden>
                <div class="sidebar-tabs">
                    <button type="button" id="survivorTabBtn" class="sidebar-tab active">
                        <img class="sidebar-tab-icon" src="../../assets/game/survivor-icon_active.svg" alt="Aide">
                    </button>
                    <button type="button" id="hordeTabBtn" class="sidebar-tab">
                        <img class="sidebar-tab-icon" src="../../assets/game/horde-icon_inactive.svg" alt="Horde">
                    </button>
                </div>
                <div class="sidebar-tab-panel">
                    <div id="sidebarHelpList" class="sidebar-help-list"></div>
                    <div id="sidebarHordeList" class="sidebar-help-list" hidden></div>
                </div>
            </div>
        </div>
        <div class="timer-panel">
            <div id="timerView">
                <div class="timer-area">
                    <div class="timer-display">
                        <span id="minutes">20</span>:<span id="seconds">00</span>:<span id="centis">00</span>
                    </div>
                </div>
                <div class="controls">
                    <div class="controls-left">
                        <button id="startBtn" disabled>Commencer</button>
                        <button id="resetBtn" disabled>Reset</button>
                    </div>
                    <button id="penaltyBtn" disabled>Penalite</button>
                </div>
                <div class="end-chapter-row">
                    <button id="endChapterBtn" class="end-chapter-btn" disabled>Terminer chapitre</button>
                </div>
            </div>
            <div id="diceResultView" class="dice-result-view" hidden>
                <div class="dice-result-content">
                    <div class="dice-result-heading">Aide obtenue :</div>
                    <ul id="diceResultList" class="dice-result-list"></ul>
                </div>
                <button id="nextBtn" class="end-chapter-btn">Suivant</button>
            </div>
            <div id="tributeView" class="dice-result-view" hidden>
                <div class="dice-result-content">
                    <div class="dice-result-heading">Tribut :</div>
                    <div id="tributeDescription" class="item-detail-description"></div>
                </div>
                <button id="okBtn" class="end-chapter-btn">Ok</button>
            </div>
            <div id="itemDetailView" class="dice-result-view" hidden>
                <div class="dice-result-content">
                    <div class="item-detail-heading-row">
                        <div id="itemDetailHeading" class="dice-result-heading"></div>
                        <div id="itemDetailBadge" class="item-detail-badge"></div>
                    </div>
                    <div id="itemDetailDescription" class="item-detail-description"></div>
                </div>
                <div class="item-detail-actions">
                    <button id="itemDetailUseBtn" type="button" class="item-detail-use-btn"></button>
                    <button id="itemDetailCloseBtn" type="button" class="item-detail-close-btn">Fermer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../core/domain/common/storage.js"></script>
    <script src="../core/domain/common/event-bus/events.js"></script>
    <script src="../core/domain/common/event-bus/bus.js"></script>
    <script src="../core/domain/game/states.js"></script>
    <script src="../core/domain/game/model.js"></script>
    <script src="../core/domain/game/store/load.js"></script>
    <script src="../core/domain/game/chapter/states.js"></script>
    <script src="../core/domain/game/chapter/model.js"></script>
    <script src="../core/use-cases/game/chapter/load-chapter/handler.js"></script>
    <script src="script.js"></script>
</body>
</html>
