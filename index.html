<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead End</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .frame {
            width: min(95vw, 420px);
            background-color: #000000;
            border: 8.5px solid #FFCC00;
            display: flex;
            flex-direction: column;
        }

        .title-banner {
            background-color: #FFCC00;
            color: #000000;
            font-family: 'Black Ops One', sans-serif;
            font-size: clamp(2rem, 10vw, 3.5rem);
            text-align: center;
            padding: clamp(10px, 2vw, 18px) 20px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(12px, 3vw, 20px);
            padding: clamp(40px, 10vw, 80px) clamp(20px, 5vw, 40px);
        }

        .nav-btn {
            display: block;
            width: 100%;
            background-color: #000000;
            color: #FFFFFF;
            border: 3px solid #FFFFFF;
            border-radius: 0;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(1rem, 3vw, 1.4rem);
            padding: clamp(12px, 2.5vw, 18px) 20px;
            cursor: pointer;
            letter-spacing: 0.05em;
            text-align: center;
            text-decoration: none;
        }

        .nav-btn:hover {
            background-color: #FFFFFF;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title-banner">Dead End</div>
        <div class="content">
            <a href="notice.html" class="nav-btn">Notice</a>
            <a href="timer.html" class="nav-btn">Timer</a>
        </div>
    </div>
</body>
</html>
