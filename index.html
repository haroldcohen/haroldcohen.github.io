<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead End - Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .frame {
            width: min(95vw, 900px);
            background-color: #000000;
            border: 8.5px solid #FFCC00;
        }

        .warning-banner {
            background-color: #FFCC00;
            color: #000000;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(1.1rem, 3.5vw, 2.2rem);
            padding: clamp(10px, 1.5vw, 16px) clamp(14px, 2vw, 24px);
            line-height: 1.2;
            text-align: center;
        }

        .timer-area {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(16px, 4vw, 48px) clamp(12px, 2vw, 24px);
        }

        .timer-display {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: clamp(2.5rem, 16vw, 10rem);
            color: #FFCC00;
            line-height: 1;
            white-space: nowrap;
            letter-spacing: -0.05em;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 clamp(12px, 2vw, 24px) clamp(14px, 2.5vw, 24px);
        }

        .controls-left {
            display: flex;
            gap: clamp(8px, 1.5vw, 16px);
        }

        button {
            background-color: #000000;
            color: #FFFFFF;
            border: 3px solid #FFFFFF;
            border-radius: 0;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(0.85rem, 2vw, 1.25rem);
            padding: clamp(7px, 1.2vw, 13px) clamp(14px, 2.5vw, 32px);
            cursor: pointer;
            letter-spacing: 0.05em;
        }
        .timer-display.danger {
            color: #D32515;
        }

        @keyframes blink-end {
            0%, 100% { color: #D32515; }
            50% { color: #FFFFFF; }
        }

        .timer-display.ended {
            animation: blink-end 0.5s ease-in-out infinite;
        }

        button:disabled {
            color: #B0B0B0;
            border-color: #B0B0B0;
            cursor: default;
        }

        .portrait-overlay {
            display: none;
        }

        @media (orientation: portrait) {
            .frame {
                display: none;
            }
            .portrait-overlay {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100vw;
                height: 100vh;
                font-family: 'Oswald', sans-serif;
                font-weight: 700;
                font-size: clamp(1.5rem, 8vw, 3rem);
                text-transform: uppercase;
                color: #FFFFFF;
            }
        }
    </style>
</head>
<body>
    <div class="portrait-overlay">Tournez votre écran</div>
    <div class="frame">
        <div class="warning-banner">WARNING: BIO HAZARDOUS CONTAINER FAILURE</div>
        <div class="timer-area">
            <div class="timer-display">
                <span id="minutes">20</span>:<span id="seconds">00</span>:<span id="centis">00</span>
            </div>
        </div>
        <div class="controls">
            <div class="controls-left">
                <button id="startBtn">START</button>
                <button id="resetBtn">RESET</button>
            </div>
            <button id="penaltyBtn">PENALTY</button>
        </div>
    </div>

    <script>
        const TOTAL_TIME = 20 * 60 * 100;
        const PENALTY_AMOUNT = 2 * 60 * 100;
        const PENALTY_FLOOR = 10 * 100;

        let timeRemaining = TOTAL_TIME;
        let isRunning = false;
        let interval = null;
        let countdownPlayed = false;

        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const centisEl = document.getElementById('centis');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const penaltyBtn = document.getElementById('penaltyBtn');
        const timerDisplay = document.querySelector('.timer-display');

        // Audio
        let audioUnlocked = false;
        const sounds = {
            start:     new Audio('assets/audio/alerts/20-minutes.mp3'),
            alert15:   new Audio('assets/audio/alerts/15-minutes.mp3'),
            alert10:   new Audio('assets/audio/alerts/10-minutes.mp3'),
            alert5:    new Audio('assets/audio/alerts/5-minutes.mp3'),
            alert1:    new Audio('assets/audio/alerts/1-minute.mp3'),
            countdown: new Audio('assets/audio/alerts/rupture-countdown.mp3'),
        };
        Object.values(sounds).forEach(a => a.preload = 'auto');

        const MILESTONES = [
            { time: 15 * 60 * 100, key: 'alert15' },
            { time: 10 * 60 * 100, key: 'alert10' },
            { time:  5 * 60 * 100, key: 'alert5'  },
            { time:  1 * 60 * 100, key: 'alert1'  },
        ];
        const milestonesPlayed = new Set();

        function unlockAudio() {
            if (audioUnlocked) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const buf = ctx.createBuffer(1, 1, 22050);
            const src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            src.start(0);
            audioUnlocked = true;
        }

        function playSound(key) {
            const audio = sounds[key];
            audio.currentTime = 0;
            audio.play().catch(() => {});
        }

        function updateDisplay() {
            const m = Math.floor(timeRemaining / 6000);
            const s = Math.floor((timeRemaining % 6000) / 100);
            const c = timeRemaining % 100;
            minutesEl.textContent = String(m).padStart(2, '0');
            secondsEl.textContent = String(s).padStart(2, '0');
            centisEl.textContent = String(c).padStart(2, '0');
        }

        function updateTimerState() {
            if (timeRemaining === 0) {
                timerDisplay.classList.remove('danger');
                timerDisplay.classList.add('ended');
            } else if (timeRemaining <= 6000) {
                timerDisplay.classList.add('danger');
                timerDisplay.classList.remove('ended');
            } else {
                timerDisplay.classList.remove('danger', 'ended');
            }
            penaltyBtn.disabled = timeRemaining <= PENALTY_FLOOR;
        }

        function checkMilestones() {
            for (const { time, key } of MILESTONES) {
                if (timeRemaining === time && !milestonesPlayed.has(key)) {
                    playSound(key);
                    milestonesPlayed.add(key);
                }
            }
            if (timeRemaining === PENALTY_FLOOR && !countdownPlayed) {
                playSound('countdown');
                countdownPlayed = true;
            }
        }

        function tick() {
            if (timeRemaining > 0) {
                timeRemaining--;
                updateDisplay();
                updateTimerState();
                checkMilestones();
            } else {
                clearInterval(interval);
                interval = null;
                isRunning = false;
            }
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                unlockAudio();
                isRunning = true;
                interval = setInterval(tick, 10);
                startBtn.textContent = 'PAUSE';
                if (timeRemaining === TOTAL_TIME) {
                    playSound('start');
                }
            } else {
                isRunning = false;
                clearInterval(interval);
                interval = null;
                startBtn.textContent = 'RESUME';
            }
        });

        penaltyBtn.addEventListener('click', () => {
            if (timeRemaining - PENALTY_AMOUNT < PENALTY_FLOOR) {
                timeRemaining = PENALTY_FLOOR;
            } else {
                timeRemaining -= PENALTY_AMOUNT;
            }
            if (timeRemaining === PENALTY_FLOOR && !countdownPlayed) {
                playSound('countdown');
                countdownPlayed = true;
            }
            updateDisplay();
            updateTimerState();
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false;
            clearInterval(interval);
            interval = null;
            timeRemaining = TOTAL_TIME;
            countdownPlayed = false;
            milestonesPlayed.clear();
            updateDisplay();
            updateTimerState();
            startBtn.textContent = 'START';
        });
    </script>
</body>
</html>
